<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>/* mfe-theme */(function(){try{var t=localStorage.getItem("mfe-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A pinhole camera: how a 3D point lands on the image</title>
<link rel="stylesheet" href="assets/kai.css">
<link rel="license" href="https://creativecommons.org/licenses/by-sa/4.0/">
<meta name="author" content="Kaveh Eftekharinasab">
</head>
<body>
<main class="fig">
  <header class="fig-head"><h1>A pinhole camera: how a 3D point lands on the image</h1><p>The camera sits at the origin and looks along the y-axis. A point <span class="v">(X, Y, Z)</span> is drawn where the line to the camera crosses the image plane <span class="v">y = f</span>: <span class="v">x′ = f·X/Y</span>, <span class="v">z′ = f·Z/Y</span>. Rotate the view by dragging.</p></header>
  <div class="layout"><div class="stage" id="stage"></div>
    <div class="side"><div class="card readout" id="out"></div><div class="card stack" id="ctl"></div></div></div>
</main>
<script src="assets/kai.js"></script>
<script src="assets/kai3d.js"></script>
<script>
(function () {
var h=KAI.h,s=KAI.s,fmt=KAI.fmt,svg=s('svg',{role:'img'});KAI.$('#stage').appendChild(svg);
function out(rows,note){var o=KAI.clear(KAI.$('#out'));rows.forEach(function(r){o.appendChild(h('div',{class:'kv'},h('span',{html:r[0]}),h('b',{html:r[1]})));});if(note)o.appendChild(h('p',{class:'note',html:note}));}
var cr=function(p,q){return [p[1]*q[2]-p[2]*q[1],p[2]*q[0]-p[0]*q[2],p[0]*q[1]-p[1]*q[0]];},dt=function(p,q){return p[0]*q[0]+p[1]*q[1]+p[2]*q[2];},ad=function(p,q){return [p[0]+q[0],p[1]+q[1],p[2]+q[2]];},sc=function(k,p){return [k*p[0],k*p[1],k*p[2]];},nm=function(p){return Math.sqrt(dt(p,p));},tri=function(p){return '('+fmt(p[0],2)+', '+fmt(p[1],2)+', '+fmt(p[2],2)+')';};
var S=KAI.scene3(svg,{range:6.5,aspect:0.8,label:'A pinhole camera, a cube and its perspective image on the image plane'});
function S_(l,mn,mx,v,st){return KAI.slider({label:l,min:mn,max:mx,step:st,value:v,digits:1,onInput:function(){S.refresh();}});}
var sf=S_('focal distance f',1,3,2,0.25),sd=S_('distance of the cube D',3,6,5,0.5),sy=S_('turn the cube (yaw)',0,90,30,5),rs=KAI.check({label:'Show the sight lines',checked:true,onChange:function(){S.refresh();}});
KAI.$('#ctl').append(sf.el,sd.el,sy.el,rs.el);
var cv=[];for(var i=0;i<8;i++)cv.push([i&1?1:-1,i&2?1:-1,i&4?1:-1]);var FC=[[0,1,3,2],[4,5,7,6],[0,1,5,4],[2,3,7,6],[0,2,6,4],[1,3,7,5]];
S.onDraw(function(S){var f=sf.get(),D=sd.get(),y=KAI.rad(sy.get()),cy=Math.cos(y),sn=Math.sin(y);S.grid(4);S.axes(6);
var W=cv.map(function(v){return [v[0]*cy-v[1]*sn,D+v[0]*sn+v[1]*cy,v[2]];}),I=W.map(function(p){return [f*p[0]/p[1],f,f*p[2]/p[1]];});
var H=1.8;S.poly([[-H,f,-H],[H,f,-H],[H,f,H],[-H,f,H]],{fill:'var(--sky-t)',stroke:'var(--blue)','stroke-width':1.3});
FC.forEach(function(fc){S.poly(fc.map(function(i){return W[i];}),{fill:'var(--green-t)',stroke:'var(--green)','stroke-width':1.2});});
if(rs.get())W.forEach(function(p,i){S.line([0,0,0],p,{stroke:'var(--axis)','stroke-width':0.9,'stroke-dasharray':'3 4'});});
FC.forEach(function(fc){for(var i=0;i<4;i++)S.line(I[fc[i]],I[fc[(i+1)%4]],{stroke:'var(--orange)','stroke-width':2.4});});
S.dot([0,0,0],6,{fill:'var(--ink)'});S.text([0,0,0],'camera');S.text([H,f,H],'image plane',{fill:'var(--blue)'});
var P0=W[7],I0=I[7],sc2=f/D;out([['vertex in space',tri(P0)],['its image (x′, f, z′)',tri(I0)],['x′ = f·X/Y',fmt(f,2)+' × '+fmt(P0[0],2)+' / '+fmt(P0[1],2)+' = '+fmt(I0[0],3)],['scale factor f / D',fmt(sc2,3)]],'Farther objects (larger Y) land closer to the centre of the image, so they look smaller. Edges of the cube that are parallel in space but not parallel to the image plane converge in the image (turn the cube to see it).');});
S.refresh();

KAI.autoHeight();
})();
</script>
</body>
</html>
