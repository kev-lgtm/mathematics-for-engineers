<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>/* mfe-theme */(function(){try{var t=localStorage.getItem("mfe-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two lines: intersection, parallel, angle</title>
<link rel="stylesheet" href="assets/kai.css">
<link rel="license" href="https://creativecommons.org/licenses/by-sa/4.0/">
<meta name="author" content="Kaveh Eftekharinasab">
</head>
<body>
<main class="fig">
  <header class="fig-head"><h1>Two lines: intersection, parallel, angle</h1><p>Drag the four points (blue pair = line 1, red pair = line 2). The single number <span class="v">D = A₁B₂ − A₂B₁</span> decides between one point, parallel and coincident; the angle uses the normals.</p></header>
  <div class="layout"><div class="stage" id="stage"></div>
    <div class="side"><div class="card readout" id="out"></div><div class="card stack" id="ctl"></div></div></div>
</main>
<script src="assets/kai.js"></script>
<script>
(function () {
var h=KAI.h,s=KAI.s,fmt=KAI.fmt,svg=s('svg',{role:'img','aria-label':'Plane with two lines defined by draggable points, their intersection and the angle between them'});KAI.nodeStage=KAI.$('#stage').appendChild(svg);
function snap(k){return function(p){return [Math.round(p[0]*k)/k,Math.round(p[1]*k)/k];};}
function out(rows,note){var o=KAI.clear(KAI.$('#out'));rows.forEach(function(r){o.appendChild(h('div',{class:'kv'},h('span',{html:r[0]}),h('b',{html:r[1]})));});if(note)o.appendChild(h('p',{class:'note',html:note}));}
function hd(P,pos,col,name,draw,k){k=k||2;return KAI.handle(P,{pos:pos,color:col,constrain:snap(k),step:1/k,label:function(p){return name+' at '+fmt(p[0],1)+', '+fmt(p[1],1);},onMove:draw});}
function lab(P,c,p,t,col){P.text(c,[p[0]+0.15,p[1]+0.2],t,{fill:col||'var(--ink)'});}
function reset(fn){return KAI.button({label:'Reset',onClick:fn});}
var P=KAI.plane(svg,{x:[-6,8],y:[-5,7]});
var hs=[hd(P,[1,2],'var(--blue)','line 1 first point',draw),hd(P,[5,5],'var(--blue)','line 1 second point',draw),hd(P,[-1,-3],'var(--verm)','line 2 first point',draw),hd(P,[2,1],'var(--verm)','line 2 second point',draw)];
KAI.$('#ctl').append(reset(function(){[[1,2],[5,5],[-1,-3],[2,1]].forEach(function(q,i){hs[i].set(q[0],q[1]);});draw();}));P.onResize(draw);
function ln(a,b){var dx=b[0]-a[0],dy=b[1]-a[1];return{a:a,u:[dx,dy],A:dy,B:-dx,C:-(dy*a[0]-dx*a[1])};}
function draw(){var p=hs.map(function(x){return x.pos();}),L1=ln(p[0],p[1]),L2=ln(p[2],p[3]),c=KAI.clear(P.content);
if(!(L1.A||L1.B)||!(L2.A||L2.B)){out([],'Two points of one line coincide: move one of them.');return;}
[[L1,'var(--blue)'],[L2,'var(--verm)']].forEach(function(e){var L=e[0],l=Math.hypot(L.u[0],L.u[1]);P.line(c,[L.a[0]-40*L.u[0]/l,L.a[1]-40*L.u[1]/l],[L.a[0]+40*L.u[0]/l,L.a[1]+40*L.u[1]/l],{stroke:e[1],'stroke-width':2.6});});
var D=L1.A*L2.B-L2.A*L1.B,n1=Math.hypot(L1.A,L1.B),n2=Math.hypot(L2.A,L2.B),dot=L1.A*L2.A+L1.B*L2.B,al=KAI.deg(Math.acos(Math.min(1,Math.abs(dot)/(n1*n2))));
var m1=L1.B?-L1.A/L1.B:Infinity,m2=L2.B?-L2.A/L2.B:Infinity,rows=[['D = A₁B₂ − A₂B₁',fmt(D,2)]],note;
if(Math.abs(D)<1e-9){var same=Math.abs(L2.A*p[0][0]+L2.B*p[0][1]+L2.C)<1e-9;rows.push(['case',same?'coincident':'parallel, no point']);note=same?'Same line: infinitely many common points.':'Parallel: no common point (the angle is 0°).';}
else{var X=[(L1.B*L2.C-L2.B*L1.C)/D,(L1.C*L2.A-L2.C*L1.A)/D];P.dot(c,X,7,{fill:'var(--orange)',stroke:'var(--bg)','stroke-width':2});lab(P,c,X,'X','var(--orange)');rows.push(['intersection','('+fmt(X[0],2)+', '+fmt(X[1],2)+')']);
note=Math.abs(dot)<1e-9?'Perpendicular: n₁·n₂ = 0.':'One common point.';}
rows.push(['acute angle α',fmt(al,1)+'°'],['slopes m₁, m₂',fmt(m1,2)+', '+fmt(m2,2)]);
if(isFinite(m1)&&isFinite(m2))rows.push(['m₁·m₂',fmt(m1*m2,2)]);
out(rows,note+' Perpendicular lines have m₁m₂ = −1.');}
draw();

KAI.autoHeight();
})();
</script>
</body>
</html>
