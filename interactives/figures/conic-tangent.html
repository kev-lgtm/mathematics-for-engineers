<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>/* mfe-theme */(function(){try{var t=localStorage.getItem("mfe-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tangent and normal lines of a conic</title>
<link rel="stylesheet" href="assets/kai.css">
<link rel="license" href="https://creativecommons.org/licenses/by-sa/4.0/">
<meta name="author" content="Kaveh Eftekharinasab">
</head>
<body>
<main class="fig">
  <header class="fig-head"><h1>Tangent and normal lines of a conic</h1><p>Choose a curve, shift its centre and move <span class="v">P</span>. The tangent comes from the gradient of the equation: its normal vector is <span class="v">∇F = (F<sub>x</sub>, F<sub>y</sub>)</span>.</p></header>
  <div class="layout"><div class="stage" id="stage"></div>
    <div class="side"><div class="card readout" id="out"></div><div class="card stack" id="ctl"></div></div></div>
</main>
<script src="assets/kai.js"></script>
<script>
(function () {
var h=KAI.h,s=KAI.s,fmt=KAI.fmt,svg=s('svg',{role:'img'});KAI.$('#stage').appendChild(svg);
function out(rows,note){var o=KAI.clear(KAI.$('#out'));rows.forEach(function(r){o.appendChild(h('div',{class:'kv'},h('span',{html:r[0]}),h('b',{html:r[1]})));});if(note)o.appendChild(h('p',{class:'note',html:note}));}
var cr=function(p,q){return [p[1]*q[2]-p[2]*q[1],p[2]*q[0]-p[0]*q[2],p[0]*q[1]-p[1]*q[0]];},dt=function(p,q){return p[0]*q[0]+p[1]*q[1]+p[2]*q[2];},ad=function(p,q){return [p[0]+q[0],p[1]+q[1],p[2]+q[2]];},sc=function(k,p){return [k*p[0],k*p[1],k*p[2]];},nm=function(p){return Math.sqrt(dt(p,p));},tri=function(p){return '('+fmt(p[0],2)+', '+fmt(p[1],2)+', '+fmt(p[2],2)+')';};
var P=KAI.plane(svg,{x:[-9,9],y:[-6,6]}),type='ell';
var sg=KAI.seg({legend:'Curve',value:'ell',options:[{value:'ell',label:'Ellipse'},{value:'hyp',label:'Hyperbola'},{value:'par',label:'Parabola'}],onChange:function(k){type=k;draw();}});
function S_(l,mn,mx,v,st){return KAI.slider({label:l,min:mn,max:mx,step:st||0.5,value:v,digits:1,onInput:function(){draw();}});}
var sa=S_('a (parabola: p = a/2)',1,5,3),sb=S_('b',1,4,2),sh=S_('centre h',-3,3,0),sk=S_('centre k',-2,2,0),sq=KAI.slider({label:'position of <i>P</i>',min:-100,max:100,step:1,value:30,digits:0,onInput:function(){draw();}});
KAI.$('#ctl').append(sg.el,sa.el,sb.el,sh.el,sk.el,sq.el);P.onResize(draw);
function draw(){var a=sa.get(),b=sb.get(),h_=sh.get(),k=sk.get(),p=a/2,c=KAI.clear(P.content),f,g;
if(type==='ell'){f=function(q){var t=q*Math.PI/100;return [h_+a*Math.cos(t),k+b*Math.sin(t)];};g=function(x,y){return [2*(x-h_)/(a*a),2*(y-k)/(b*b)];};}
else if(type==='hyp'){f=function(q){var u=q*0.02;return [h_+a*Math.cosh(u),k+b*Math.sinh(u)];};g=function(x,y){return [2*(x-h_)/(a*a),-2*(y-k)/(b*b)];};}
else{f=function(q){var s=q*0.02;return [h_+p*s*s,k+2*p*s];};g=function(x,y){return [-4*p,2*(y-k)];};}
var pts=[],pts2=[];for(var i=-100;i<=100;i+=2){var z=f(i);pts.push(z);pts2.push([2*h_-z[0],z[1]]);}
P.polyline(c,pts,{stroke:'var(--blue)','stroke-width':2.8});if(type==='hyp')P.polyline(c,pts2,{stroke:'var(--blue)','stroke-width':2.8});
P.dot(c,[h_,k],4,{fill:'var(--axis)'});var Pt=f(sq.get()),G=g(Pt[0],Pt[1]),N=Math.hypot(G[0],G[1]),n=[G[0]/N,G[1]/N],t=[-n[1],n[0]];
P.line(c,[Pt[0]-9*t[0],Pt[1]-9*t[1]],[Pt[0]+9*t[0],Pt[1]+9*t[1]],{stroke:'var(--green)','stroke-width':2.2});P.line(c,[Pt[0]-9*n[0],Pt[1]-9*n[1]],[Pt[0]+9*n[0],Pt[1]+9*n[1]],{stroke:'var(--purple)','stroke-width':1.6,'stroke-dasharray':'5 4'});
P.arrow(c,Pt,[Pt[0]+1.8*n[0],Pt[1]+1.8*n[1]],{stroke:'var(--purple)',width:3});P.dot(c,Pt,6,{fill:'var(--orange)',stroke:'var(--bg)','stroke-width':2});P.text(c,[Pt[0]+0.2,Pt[1]+0.45],'P',{fill:'var(--orange)'});
var m=Math.abs(G[1])<1e-9?null:-G[0]/G[1],cst=G[0]*Pt[0]+G[1]*Pt[1];
out([['point P','('+fmt(Pt[0],2)+', '+fmt(Pt[1],2)+')'],['gradient ∇F','('+fmt(G[0],3)+', '+fmt(G[1],3)+')'],['<span class="green">tangent line</span>',fmt(G[0],3)+'x '+(G[1]<0?'−':'+')+' '+fmt(Math.abs(G[1]),3)+'y = '+fmt(cst,3)],['tangent slope',m===null?'vertical':fmt(m,3)],['<span class="purple">normal slope</span>',Math.abs(G[0])<1e-9?'vertical':fmt(G[1]/G[0],3)]],
({ell:'F = (x−h)²/a² + (y−k)²/b² − 1.',hyp:'F = (x−h)²/a² − (y−k)²/b² − 1 (right branch shown, the left is its mirror image).',par:'F = (y−k)² − 4p(x−h).'})[type]+' The tangent is the line through P perpendicular to ∇F; the normal line points along ∇F.');}
draw();

KAI.autoHeight();
})();
</script>
</body>
</html>
