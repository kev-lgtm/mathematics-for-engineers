<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>/* mfe-theme */(function(){try{var t=localStorage.getItem("mfe-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cylindrical and spherical coordinates</title>
<link rel="stylesheet" href="assets/kai.css">
<link rel="license" href="https://creativecommons.org/licenses/by-sa/4.0/">
<meta name="author" content="Kaveh Eftekharinasab">
</head>
<body>
<main class="fig">
  <header class="fig-head"><h1>Cylindrical and spherical coordinates</h1><p>Choose a coordinate system and move the sliders; rotate the scene by dragging. The point is built from a distance, an azimuth angle <span class="v">θ</span> in the xy-plane, and either a height <span class="v">z</span> or a polar angle <span class="v">φ</span> measured from the z-axis.</p></header>
  <div class="layout"><div class="stage" id="stage"></div>
    <div class="side"><div class="card readout" id="out"></div><div class="card stack" id="ctl"></div></div></div>
</main>
<script src="assets/kai.js"></script>
<script src="assets/kai3d.js"></script>
<script>
(function () {
var h=KAI.h,s=KAI.s,fmt=KAI.fmt,svg=s('svg',{role:'img'});KAI.$('#stage').appendChild(svg);
function out(rows,note){var o=KAI.clear(KAI.$('#out'));rows.forEach(function(r){o.appendChild(h('div',{class:'kv'},h('span',{html:r[0]}),h('b',{html:r[1]})));});if(note)o.appendChild(h('p',{class:'note',html:note}));}
var cr=function(p,q){return [p[1]*q[2]-p[2]*q[1],p[2]*q[0]-p[0]*q[2],p[0]*q[1]-p[1]*q[0]];},dt=function(p,q){return p[0]*q[0]+p[1]*q[1]+p[2]*q[2];},ad=function(p,q){return [p[0]+q[0],p[1]+q[1],p[2]+q[2]];},sc=function(k,p){return [k*p[0],k*p[1],k*p[2]];},nm=function(p){return Math.sqrt(dt(p,p));},tri=function(p){return '('+fmt(p[0],2)+', '+fmt(p[1],2)+', '+fmt(p[2],2)+')';};
var S=KAI.scene3(svg,{range:4.5,label:'A point with its cylindrical or spherical coordinates, drop lines and angles'}),mode='sph';
var s1=KAI.slider({label:'distance (r or ρ)',min:0,max:4,step:0.25,value:3,digits:2,onInput:function(){S.refresh();}}),s2=KAI.slider({label:'azimuth θ',min:0,max:360,step:5,value:45,digits:0,unit:'°',onInput:function(){S.refresh();}}),sp=KAI.slider({label:'polar angle φ (from the z-axis)',min:0,max:180,step:5,value:60,digits:0,unit:'°',onInput:function(){S.refresh();}}),sz=KAI.slider({label:'height z',min:-3,max:3,step:0.25,value:2,digits:2,onInput:function(){S.refresh();}});
sz.el.style.display='none';
var sg=KAI.seg({legend:'Coordinates',value:'sph',options:[{value:'sph',label:'Spherical (ρ, θ, φ)'},{value:'cyl',label:'Cylindrical (r, θ, z)'}],onChange:function(k){mode=k;sz.el.style.display=k==='cyl'?'':'none';sp.el.style.display=k==='sph'?'':'none';S.refresh();}});
KAI.$('#ctl').append(sg.el,s1.el,s2.el,sp.el,sz.el);
function arc(f,a,b,at){var pr=f(a);for(var i=1;i<=24;i++){var q=f(a+(b-a)*i/24);S.line(pr,q,at);pr=q;}}
S.onDraw(function(S){var d=s1.get(),th=KAI.rad(s2.get()),x,y,z,cr_,ph,rho;S.axes(4.3);
if(mode==='sph'){ph=KAI.rad(sp.get());rho=d;cr_=d*Math.sin(ph);z=d*Math.cos(ph);}else{cr_=d;z=sz.get();rho=Math.hypot(d,z);ph=rho>1e-9?Math.acos(z/rho):0;}
x=cr_*Math.cos(th);y=cr_*Math.sin(th);var Pt=[x,y,z],Q=[x,y,0];S.grid(4);
if(cr_>1e-9)arc(function(t){return [cr_*Math.cos(t),cr_*Math.sin(t),z];},0,2*Math.PI,{stroke:'var(--axis)','stroke-width':1,'stroke-dasharray':'3 4'});
S.line([0,0,0],Q,{stroke:'var(--blue)','stroke-width':3});S.line(Q,Pt,{stroke:'var(--green)','stroke-width':3,'stroke-dasharray':'5 4'});S.line([0,0,0],Pt,{stroke:'var(--orange)','stroke-width':3.4});
if(cr_>0.3){arc(function(t){return [1.1*Math.cos(t),1.1*Math.sin(t),0];},0,th,{stroke:'var(--purple)','stroke-width':2.4});S.text([1.3*Math.cos(th/2),1.3*Math.sin(th/2),0],'θ',{fill:'var(--purple)'});}
if(rho>0.3&&cr_>0.05){arc(function(t){return [1.5*Math.sin(t)*Math.cos(th),1.5*Math.sin(t)*Math.sin(th),1.5*Math.cos(t)];},0,ph,{stroke:'var(--verm)','stroke-width':2.4});S.text([1.7*Math.sin(ph/2)*Math.cos(th),1.7*Math.sin(ph/2)*Math.sin(th),1.7*Math.cos(ph/2)],'φ',{fill:'var(--verm)'});}
S.dot(Q,4,{fill:'var(--blue)'});S.dot(Pt,7,{fill:'var(--orange)',stroke:'var(--bg)','stroke-width':2});S.text(Pt,'P',{fill:'var(--orange)'});
var thd=((KAI.deg(th)%360)+360)%360;out([['Cartesian (x, y, z)','('+fmt(x,2)+', '+fmt(y,2)+', '+fmt(z,2)+')'],['<span class="blue">cylindrical (r, θ, z)</span>','('+fmt(cr_,2)+', '+fmt(thd,0)+'°, '+fmt(z,2)+')'],['<span class="verm">spherical (ρ, θ, φ)</span>','('+fmt(rho,2)+', '+fmt(thd,0)+'°, '+fmt(KAI.deg(ph),0)+'°)']],'x = r cos θ, y = r sin θ, z = z.   x = ρ sin φ cos θ, y = ρ sin φ sin θ, z = ρ cos φ.   r = ρ sin φ, ρ² = r² + z². The orange segment is ρ, the blue one is r, the dashed green one is z.');});
S.refresh();

KAI.autoHeight();
})();
</script>
</body>
</html>
