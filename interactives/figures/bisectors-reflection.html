<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>/* mfe-theme */(function(){try{var t=localStorage.getItem("mfe-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Angle bisectors and reflecting a line</title>
<link rel="stylesheet" href="assets/kai.css">
<link rel="license" href="https://creativecommons.org/licenses/by-sa/4.0/">
<meta name="author" content="Kaveh Eftekharinasab">
</head>
<body>
<main class="fig">
  <header class="fig-head"><h1>Angle bisectors and reflecting a line</h1><p>Drag the four points (blue pair = <span class="v">L₁</span>, red pair = <span class="v">L₂</span>). The two angle bisectors consist of the points equally far from both lines; the dashed purple line is the mirror image of <span class="v">L₁</span> in <span class="v">L₂</span>.</p></header>
  <div class="layout"><div class="stage" id="stage"></div>
    <div class="side"><div class="card readout" id="out"></div><div class="card stack" id="ctl"></div></div></div>
</main>
<script src="assets/kai.js"></script>
<script>
(function () {
var h=KAI.h,s=KAI.s,fmt=KAI.fmt,svg=s('svg',{role:'img'});KAI.$('#stage').appendChild(svg);
function out(rows,note){var o=KAI.clear(KAI.$('#out'));rows.forEach(function(r){o.appendChild(h('div',{class:'kv'},h('span',{html:r[0]}),h('b',{html:r[1]})));});if(note)o.appendChild(h('p',{class:'note',html:note}));}
var cr=function(p,q){return [p[1]*q[2]-p[2]*q[1],p[2]*q[0]-p[0]*q[2],p[0]*q[1]-p[1]*q[0]];},dt=function(p,q){return p[0]*q[0]+p[1]*q[1]+p[2]*q[2];},ad=function(p,q){return [p[0]+q[0],p[1]+q[1],p[2]+q[2]];},sc=function(k,p){return [k*p[0],k*p[1],k*p[2]];},nm=function(p){return Math.sqrt(dt(p,p));},tri=function(p){return '('+fmt(p[0],2)+', '+fmt(p[1],2)+', '+fmt(p[2],2)+')';};
var P=KAI.plane(svg,{x:[-6,8],y:[-5,7]});
function hd(pos,col,name){return KAI.handle(P,{pos:pos,color:col,constrain:function(p){return [Math.round(p[0]*2)/2,Math.round(p[1]*2)/2];},step:0.5,label:function(p){return name+' at '+fmt(p[0],1)+', '+fmt(p[1],1);},onMove:draw});}
var hs=[hd([1,2],'var(--blue)','line 1 first point'),hd([5,5],'var(--blue)','line 1 second point'),hd([-1,-3],'var(--verm)','line 2 first point'),hd([2,1],'var(--verm)','line 2 second point')];
var cb=KAI.check({label:'Angle bisectors',checked:true,onChange:draw}),cr_=KAI.check({label:'Reflect L₁ in L₂',checked:true,onChange:draw});
KAI.$('#ctl').append(cb.el,cr_.el,KAI.button({label:'Reset points',onClick:function(){[[1,2],[5,5],[-1,-3],[2,1]].forEach(function(q,i){hs[i].set(q[0],q[1]);});draw();}}));P.onResize(draw);
function ln(a,b){var A=b[1]-a[1],B=-(b[0]-a[0]);return [A,B,-(A*a[0]+B*a[1])];}
function seg(c,L,at){var A=L[0],B=L[1],C=L[2];if(Math.abs(A)<1e-9&&Math.abs(B)<1e-9)return;if(Math.abs(B)>=Math.abs(A))P.line(c,[-40,(A*40-C)/B],[40,(-A*40-C)/B],at);else P.line(c,[(B*40-C)/A,-40],[(-B*40-C)/A,40],at);}
function eqs(L){return fmt(L[0],2)+'x '+(L[1]<0?'−':'+')+' '+fmt(Math.abs(L[1]),2)+'y '+(L[2]<0?'−':'+')+' '+fmt(Math.abs(L[2]),2)+' = 0';}
function draw(){var p=hs.map(function(x){return x.pos();}),c=KAI.clear(P.content),L1=ln(p[0],p[1]),L2=ln(p[2],p[3]),N1=Math.hypot(L1[0],L1[1]),N2=Math.hypot(L2[0],L2[1]);
if(N1<1e-9||N2<1e-9){out([],'Two points of one line coincide: move one of them.');return;}
seg(c,L1,{stroke:'var(--blue)','stroke-width':2.6});seg(c,L2,{stroke:'var(--verm)','stroke-width':2.6});var rows=[];
if(cb.get()){var Bm=[L1[0]/N1-L2[0]/N2,L1[1]/N1-L2[1]/N2,L1[2]/N1-L2[2]/N2],Bp=[L1[0]/N1+L2[0]/N2,L1[1]/N1+L2[1]/N2,L1[2]/N1+L2[2]/N2];seg(c,Bm,{stroke:'var(--green)','stroke-width':2.2,'stroke-dasharray':'7 4'});seg(c,Bp,{stroke:'var(--orange)','stroke-width':2.2,'stroke-dasharray':'7 4'});rows.push(['<span class="green">bisector 1</span>',eqs(Bm)],['<span style="color:var(--orange)">bisector 2</span>',eqs(Bp)]);}
if(cr_.get()){var rp=function(q){var k=2*(L2[0]*q[0]+L2[1]*q[1]+L2[2])/(N2*N2);return [q[0]-k*L2[0],q[1]-k*L2[1]];},r0=rp(p[0]),r1=rp(p[1]);if(Math.hypot(r1[0]-r0[0],r1[1]-r0[1])>1e-9){var R=ln(r0,r1);seg(c,R,{stroke:'var(--purple)','stroke-width':2.4,'stroke-dasharray':'3 4'});rows.push(['<span class="purple">mirror image of L₁</span>',eqs(R)]);}}
var D=L1[0]*L2[1]-L2[0]*L1[1];if(Math.abs(D)>1e-9){var X=[(L1[1]*L2[2]-L2[1]*L1[2])/D,(L1[2]*L2[0]-L2[2]*L1[0])/D];P.dot(c,X,7,{fill:'var(--ink)',stroke:'var(--bg)','stroke-width':2});rows.push(['intersection','('+fmt(X[0],2)+', '+fmt(X[1],2)+')']);}
rows.push(['angle between the lines',fmt(KAI.deg(Math.acos(Math.min(1,Math.abs(L1[0]*L2[0]+L1[1]*L2[1])/(N1*N2)))),1)+'°']);
out(rows,Math.abs(D)<1e-9?'The lines are parallel: only the midline between them is equidistant from both.':'Bisectors: (A₁x + B₁y + C₁)/|n₁| = ± (A₂x + B₂y + C₂)/|n₂|. The two bisectors are perpendicular, and the mirror image of L₁ in L₂ passes through the intersection point.');}
draw();

KAI.autoHeight();
})();
</script>
</body>
</html>
