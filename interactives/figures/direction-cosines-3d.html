<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>/* mfe-theme */(function(){try{var t=localStorage.getItem("mfe-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Direction angles and direction cosines</title>
<link rel="stylesheet" href="assets/kai.css">
<link rel="license" href="https://creativecommons.org/licenses/by-sa/4.0/">
<meta name="author" content="Kaveh Eftekharinasab">
</head>
<body>
<main class="fig">
  <header class="fig-head"><h1>Direction angles and direction cosines</h1><p>Set the components of a vector and rotate the scene by dragging. The vector makes angles <span class="v">α, β, γ</span> with the three axes. Their cosines are the components of the unit vector, so <span class="v">cos²α + cos²β + cos²γ = 1</span>.</p></header>
  <div class="layout"><div class="stage" id="stage"></div>
    <div class="side"><div class="card readout" id="out"></div><div class="card stack" id="ctl"></div></div></div>
</main>
<script src="assets/kai.js"></script>
<script src="assets/kai3d.js"></script>
<script>
(function () {
var h=KAI.h,s=KAI.s,fmt=KAI.fmt,svg=s('svg',{role:'img'});KAI.$('#stage').appendChild(svg);
function out(rows,note){var o=KAI.clear(KAI.$('#out'));rows.forEach(function(r){o.appendChild(h('div',{class:'kv'},h('span',{html:r[0]}),h('b',{html:r[1]})));});if(note)o.appendChild(h('p',{class:'note',html:note}));}
var cr=function(p,q){return [p[1]*q[2]-p[2]*q[1],p[2]*q[0]-p[0]*q[2],p[0]*q[1]-p[1]*q[0]];},dt=function(p,q){return p[0]*q[0]+p[1]*q[1]+p[2]*q[2];},ad=function(p,q){return [p[0]+q[0],p[1]+q[1],p[2]+q[2]];},sc=function(k,p){return [k*p[0],k*p[1],k*p[2]];},nm=function(p){return Math.sqrt(dt(p,p));},tri=function(p){return '('+fmt(p[0],2)+', '+fmt(p[1],2)+', '+fmt(p[2],2)+')';};
var S=KAI.scene3(svg,{range:4.5,label:'A vector with the angles it makes with the three coordinate axes'});
var sl=['x','y','z'].map(function(n,i){return KAI.slider({label:'component '+n,min:-4,max:4,step:0.5,value:[2,2,1][i],digits:1,onInput:function(){S.refresh();}});});
KAI.$('#ctl').append(sl[0].el,sl[1].el,sl[2].el,KAI.button({label:'Reset',onClick:function(){[2,2,1].forEach(function(v,i){sl[i].set(v);});S.refresh();}}));
S.onDraw(function(S){var v=sl.map(function(x){return x.get();}),N=nm(v);S.grid(4);S.axes(4.3);
if(N<1e-9){out([],'The zero vector has no direction.');return;}
var vh=sc(1/N,v),cols=['var(--blue)','var(--green)','var(--verm)'],gk=['α','β','γ'],rows=[];
for(var i=0;i<8;i++){var a=[i&1?v[0]:0,i&2?v[1]:0,i&4?v[2]:0];for(var j=0;j<3;j++)if(!(i&(1<<j))){var b=a.slice();b[j]=v[j];S.line(a,b,{stroke:'var(--axis)','stroke-width':1,'stroke-dasharray':'3 4'});}}
S.arrow([0,0,0],v,{stroke:'var(--ink)',width:3.6});S.text(v,'v');
[0,1,2].forEach(function(i){var e=[0,0,0];e[i]=1;var th=Math.acos(KAI.clamp(vh[i],-1,1)),w=ad(vh,sc(-vh[i],e)),wn=nm(w);if(wn>1e-9&&th>0.02){w=sc(1/wn,w);var r=1.2+0.35*i,pr=sc(r,e);for(var k=1;k<=24;k++){var s=th*k/24,q=sc(r,ad(sc(Math.cos(s),e),sc(Math.sin(s),w)));S.line(pr,q,{stroke:cols[i],'stroke-width':2.8});pr=q;}S.text(sc(r+0.3,ad(sc(Math.cos(th/2),e),sc(Math.sin(th/2),w))),gk[i],{fill:cols[i]});}
rows.push(['<span style="color:'+cols[i]+'">'+gk[i]+' (with the '+'xyz'[i]+'-axis), cos '+gk[i]+'</span>',fmt(KAI.deg(th),1)+'°, '+fmt(vh[i],3)]);});
rows.unshift(['|v|',fmt(N,3)]);rows.push(['cos²α + cos²β + cos²γ',fmt(vh[0]*vh[0]+vh[1]*vh[1]+vh[2]*vh[2],6)],['unit vector v/|v|',tri(vh)]);
out(rows,'cos α = vₓ/|v|, cos β = v_y/|v|, cos γ = v_z/|v|. For v = (2, 2, 1): |v| = 3 and the cosines are 2/3, 2/3, 1/3. The three angles cannot be chosen freely: the sum of the squared cosines is always 1.');});
S.refresh();

KAI.autoHeight();
})();
</script>
</body>
</html>
