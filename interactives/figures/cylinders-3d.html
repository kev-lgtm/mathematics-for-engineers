<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>/* mfe-theme */(function(){try{var t=localStorage.getItem("mfe-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cylindrical surfaces: elliptic, hyperbolic and parabolic</title>
<link rel="stylesheet" href="assets/kai.css">
<link rel="license" href="https://creativecommons.org/licenses/by-sa/4.0/">
<meta name="author" content="Kaveh Eftekharinasab">
</head>
<body>
<main class="fig">
  <header class="fig-head"><h1>Cylindrical surfaces: elliptic, hyperbolic and parabolic</h1><p>A cylinder is a plane curve slid along a line (here the z-axis), so its equation has no <span class="v">z</span> in it. Choose the base curve and set its shape; rotate by dragging.</p></header>
  <div class="layout"><div class="stage" id="stage"></div>
    <div class="side"><div class="card readout" id="out"></div><div class="card stack" id="ctl"></div></div></div>
</main>
<script src="assets/kai.js"></script>
<script src="assets/kai3d.js"></script>
<script>
(function () {
var h=KAI.h,s=KAI.s,fmt=KAI.fmt,svg=s('svg',{role:'img'});KAI.$('#stage').appendChild(svg);
function out(rows,note){var o=KAI.clear(KAI.$('#out'));rows.forEach(function(r){o.appendChild(h('div',{class:'kv'},h('span',{html:r[0]}),h('b',{html:r[1]})));});if(note)o.appendChild(h('p',{class:'note',html:note}));}
var cr=function(p,q){return [p[1]*q[2]-p[2]*q[1],p[2]*q[0]-p[0]*q[2],p[0]*q[1]-p[1]*q[0]];},dt=function(p,q){return p[0]*q[0]+p[1]*q[1]+p[2]*q[2];},ad=function(p,q){return [p[0]+q[0],p[1]+q[1],p[2]+q[2]];},sc=function(k,p){return [k*p[0],k*p[1],k*p[2]];},nm=function(p){return Math.sqrt(dt(p,p));},tri=function(p){return '('+fmt(p[0],2)+', '+fmt(p[1],2)+', '+fmt(p[2],2)+')';};
var S=KAI.scene3(svg,{range:4.5,label:'A cylindrical surface over an elliptic, hyperbolic or parabolic base curve'}),type='ell';
var sg=KAI.seg({legend:'Cylinder',value:'ell',options:[{value:'ell',label:'Elliptic'},{value:'hyp',label:'Hyperbolic'},{value:'par',label:'Parabolic'}],onChange:function(k){type=k;S.refresh();}});
var sa=KAI.slider({label:'a',min:0.5,max:2.5,step:0.25,value:2,digits:2,onInput:function(){S.refresh();}}),sb=KAI.slider({label:'b',min:0.5,max:2.5,step:0.25,value:1.5,digits:2,onInput:function(){S.refresh();}}),sz=KAI.slider({label:'height of the highlighted slice z',min:-3,max:3,step:0.25,value:0.5,digits:2,onInput:function(){S.refresh();}});
KAI.$('#ctl').append(sg.el,sa.el,sb.el,sz.el);
function curves(a,b){var br=[];if(type==='ell'){var c=[];for(var i=0;i<=48;i++){var t=i*Math.PI/24;c.push([a*Math.cos(t),b*Math.sin(t)]);}br.push(c);}
else if(type==='hyp'){var r=[],l=[];for(var i=0;i<=24;i++){var u=-1.3+2.6*i/24;r.push([a*Math.cosh(u),b*Math.sinh(u)]);l.push([-a*Math.cosh(u),b*Math.sinh(u)]);}br.push(r,l);}
else{var c=[];for(var i=0;i<=24;i++){var x=-3.2+6.4*i/24;c.push([x,x*x/(4*a)-1.5]);}br.push(c);}return br;}
S.onDraw(function(S){var a=sa.get(),b=sb.get(),zs=sz.get(),br=curves(a,b),eq={ell:'x²/a² + y²/b² = 1',hyp:'x²/a² − y²/b² = 1',par:'y = x²/(4a) − 1.5'}[type];S.grid(4);S.axes(4.3);
br.forEach(function(c){[-3,3].forEach(function(z){for(var i=0;i<c.length-1;i++)S.line([c[i][0],c[i][1],z],[c[i+1][0],c[i+1][1],z],{stroke:'var(--blue)','stroke-width':1.6});});
for(var i=0;i<c.length;i+=2)S.line([c[i][0],c[i][1],-3],[c[i][0],c[i][1],3],{stroke:'var(--axis)','stroke-width':0.9});
for(var i=0;i<c.length-1;i++)S.line([c[i][0],c[i][1],zs],[c[i+1][0],c[i+1][1],zs],{stroke:'var(--orange)','stroke-width':3.4});});
out([['surface','<b>'+({ell:'elliptic cylinder',hyp:'hyperbolic cylinder',par:'parabolic cylinder'})[type]+'</b>'],['equation (no z!)',eq],['slice at z = '+fmt(zs,2),'the same '+({ell:'ellipse',hyp:'hyperbola (two branches)',par:'parabola'})[type]+' for every z']],'The thin vertical lines are the generators: all parallel to the z-axis. Because z does not occur in the equation, the same curve repeats at every height.');});
S.refresh();

KAI.autoHeight();
})();
</script>
</body>
</html>
